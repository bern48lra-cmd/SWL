<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Home Page</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

.container {
    max-width: 850px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #1e293b;
    font-size: 32px;
    margin: 20px 0 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.page-button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    padding: 20px;
    border-radius: 16px;
    color: white;
    text-decoration: none;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 4px 8px #0002;
    transition: transform 0.15s;
}

.page-button:active {
    transform: scale(0.97);
}

.blue { background: #2563eb; }
.green { background: #059669; }
.purple { background: #7c3aed; }
.orange { background: #ea580c; }
.red { background: #dc2626; }
.dark { background: #334155; }

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    h1 {
        font-size: 27px;
    }

    .buttons {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .page-button {
        min-height: 95px;
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>My Home Page</h1>
    <p class="subtitle">Select a page below</p>

    <div class="buttons">

        <a href="page1.html" class="page-button blue">
            📅 Page One
        </a>

        <a href="page2.html" class="page-button green">
            🎾 Page Two
        </a>

        <a href="page3.html" class="page-button purple">
            🌐 Page Three
        </a>

        <a href="page4.html" class="page-button orange">
            📊 Page Four
        </a>

        <a href="page5.html" class="page-button red">
            📁 Page Five
        </a>

        <a href="page6.html" class="page-button dark">
            ⚙️ Page Six
        </a>

    </div>
</div>

</body>
</html>
